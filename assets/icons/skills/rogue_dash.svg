<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rogueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181308"/>
      <stop offset="100%" stop-color="#0a0802"/>
    </linearGradient>
    <linearGradient id="goldLead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="50%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#fff066"/>
    </linearGradient>
    <linearGradient id="goldMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc7a00"/>
      <stop offset="100%" stop-color="#ffa600"/>
    </linearGradient>
    <linearGradient id="goldTail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#804d00"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Plate -->
  <rect width="128" height="128" rx="22" fill="url(#rogueBg)"/>
  <rect width="124" height="124" x="2" y="2" rx="20" fill="none" stroke="#ffd700" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Tech Corner Accents -->
  <path d="M 12 28 L 12 16 L 28 16" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <path d="M 116 28 L 116 16 L 100 16" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <path d="M 12 100 L 12 112 L 28 112" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <path d="M 116 100 L 116 112 L 100 112" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>

  <!-- Speed Motion Blur Streaks (Left side) -->
  <line x1="16" y1="40" x2="36" y2="40" stroke="#ffaa00" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="12" y1="50" x2="44" y2="50" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="64" x2="52" y2="64" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="12" y1="78" x2="44" y2="78" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="88" x2="36" y2="88" stroke="#ffaa00" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Quantum Dash Triple Chevrons -->
  <g filter="url(#glowGold)">
    <!-- Rear / Echo Chevron -->
    <polygon points="34,36 50,64 34,92 46,92 62,64 46,36" fill="url(#goldTail)" opacity="0.5"/>

    <!-- Middle Chevron -->
    <polygon points="52,30 72,64 52,98 66,98 86,64 66,30" fill="url(#goldMid)" opacity="0.85"/>

    <!-- Front / Lead Chevron -->
    <polygon points="72,24 98,64 72,104 88,104 114,64 88,24" fill="url(#goldLead)"/>
    <polygon points="82,32 102,64 82,96 88,96 108,64 88,32" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Forward Apex Velocity Point -->
  <circle cx="114" cy="64" r="3.5" fill="#ffffff"/>
  <line x1="114" y1="64" x2="122" y2="64" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Aerodynamic Vent Slots on Chevrons -->
  <line x1="72" y1="52" x2="78" y2="52" stroke="#181308" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="76" x2="78" y2="76" stroke="#181308" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="54" x2="57" y2="54" stroke="#181308" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="74" x2="57" y2="74" stroke="#181308" stroke-width="2" stroke-linecap="round"/>
</svg>
