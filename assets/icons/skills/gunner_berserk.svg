<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gunnerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c070a"/>
      <stop offset="100%" stop-color="#0a0203"/>
    </linearGradient>
    <linearGradient id="berserkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="fireFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="60%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffee55"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Plate -->
  <rect width="128" height="128" rx="22" fill="url(#gunnerBg)"/>
  <rect width="124" height="124" x="2" y="2" rx="20" fill="none" stroke="#ff2a4b" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Tech Corner Accents -->
  <path d="M 12 28 L 12 16 L 28 16" fill="none" stroke="#ff2a4b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 116 28 L 116 16 L 100 16" fill="none" stroke="#ff2a4b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 12 100 L 12 112 L 28 112" fill="none" stroke="#ff2a4b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 116 100 L 116 112 L 100 112" fill="none" stroke="#ff2a4b" stroke-width="3" stroke-linecap="round"/>

  <!-- Reticle Spikes & Overdrive Arc Lines -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#ff1744" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.4"/>
  <line x1="64" y1="10" x2="64" y2="22" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="64" y2="118" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="64" x2="22" y2="64" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
  <line x1="106" y1="64" x2="118" y2="64" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>

  <!-- Crossed Heavy Minigun Barrels (Angled behind skull) -->
  <g opacity="0.85">
    <!-- Barrel 1: Top-Left to Bottom-Right -->
    <rect x="22" y="60" width="84" height="8" rx="2" transform="rotate(45 64 64)" fill="#331015" stroke="#ff3d00" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="3" fill="#ff9100"/>
    <circle cx="94" cy="94" r="3" fill="#ff9100"/>

    <!-- Barrel 2: Bottom-Left to Top-Right -->
    <rect x="22" y="60" width="84" height="8" rx="2" transform="rotate(-45 64 64)" fill="#331015" stroke="#ff3d00" stroke-width="1.5"/>
    <circle cx="94" cy="34" r="3" fill="#ff9100"/>
    <circle cx="34" cy="94" r="3" fill="#ff9100"/>
  </g>

  <!-- Cybernetic Berserk Skull / Mech Faceplate -->
  <g filter="url(#glowRed)">
    <!-- Skull Cranium / Brow Armor -->
    <polygon points="36,36 64,24 92,36 96,56 86,72 64,78 42,72 32,56" fill="url(#berserkRed)"/>

    <!-- Angular Mech Cheekplates & Teeth / Grate -->
    <polygon points="44,72 84,72 78,98 64,104 50,98" fill="#d50000"/>
    <!-- Teeth / Grate Vents -->
    <rect x="52" y="78" width="5" height="16" rx="1.5" fill="#1c070a"/>
    <rect x="61.5" y="78" width="5" height="18" rx="1.5" fill="#1c070a"/>
    <rect x="71" y="78" width="5" height="16" rx="1.5" fill="#1c070a"/>

    <!-- Angry Angular Visor Eye Slits (Glowing Hot) -->
    <polygon points="40,48 58,56 56,62 42,54" fill="#ffee55"/>
    <polygon points="88,48 70,56 72,62 86,54" fill="#ffee55"/>
    <line x1="42" y1="51" x2="56" y2="58" stroke="#ffffff" stroke-width="2"/>
    <line x1="86" y1="51" x2="72" y2="58" stroke="#ffffff" stroke-width="2"/>

    <!-- Forehead Cyber Sigil / Overdrive Chevron -->
    <polygon points="64,30 72,42 64,38 56,42" fill="#ffee55"/>
  </g>

  <!-- Overdrive Flame Aura Spikes (Top) -->
  <polygon points="64,18 70,28 64,26 58,28" fill="url(#fireFlame)"/>
  <polygon points="48,22 56,32 50,32 44,28" fill="url(#fireFlame)" opacity="0.8"/>
  <polygon points="80,22 84,28 78,32 72,32" fill="url(#fireFlame)" opacity="0.8"/>
</svg>
